<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Malware Sandbox</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body data-page="login" data-public="true">

<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-card__brand">
      <svg viewBox="0 0 24 24" style="color:var(--accent-500)"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" stroke="currentColor" stroke-width="1"/></svg>
      <div class="brand-name">MALWARE SANDBOX</div>
      <div class="brand-sub">Platform // Access Terminal</div>
    </div>

    <h1>Вход в систему</h1>
    <p class="lede">Авторизуйтесь для доступа к платформе</p>

    <div class="form-error" id="form-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="user@example.com">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="login-submit">Войти</button>
    </form>

    <p style="margin-top:20px;font-size:13px;text-align:center">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></p>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script>
(async function () {
  try {
    const res = await authApi.me();
    if (res.data) { location.href = '/dashboard.html'; return; }
  } catch (_) {}

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('form-error');
  const submitBtn = document.getElementById('login-submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Вхожу…';
    try {
      await authApi.login(document.getElementById('email').value.trim(), document.getElementById('password').value);
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || '/dashboard.html';
    } catch (err) {
      errorBox.textContent = extractErrorMessage(err);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Войти';
    }
  });
})();
</script>
</body>
</html>
