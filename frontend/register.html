<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Malware Sandbox</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body data-page="register" data-public="true">

<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-card__brand">
      <svg viewBox="0 0 24 24" style="color:var(--accent-500)"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" stroke="currentColor" stroke-width="1"/></svg>
      <div class="brand-name">MALWARE SANDBOX</div>
      <div class="brand-sub">Platform // New Access</div>
    </div>

    <h1>Регистрация</h1>
    <p class="lede">Пароль — не короче 8 символов</p>

    <div class="form-error" id="form-error"></div>

    <form id="register-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="user@example.com">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Минимум 8 символов">
      </div>
      <div class="field">
        <label for="password2">Повторите пароль</label>
        <input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password">
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="submit-btn">Создать аккаунт</button>
    </form>

    <p style="margin-top:20px;font-size:13px;text-align:center">Уже есть аккаунт? <a href="/index.html">Войти</a></p>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script>
(async function () {
  try {
    const res = await authApi.me();
    if (res.data) { location.href = '/dashboard.html'; return; }
  } catch (_) {}

  const form = document.getElementById('register-form');
  const errorBox = document.getElementById('form-error');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.textContent = '';
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    if (password !== password2) {
      errorBox.textContent = 'Пароли не совпадают';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Создаю аккаунт…';
    try {
      await authApi.register(document.getElementById('email').value.trim(), password);
      location.href = '/dashboard.html';
    } catch (err) {
      errorBox.textContent = extractErrorMessage(err);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Создать аккаунт';
    }
  });
})();
</script>
</body>
</html>
