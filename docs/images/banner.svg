<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(34, 211, 245, 0.15)"/>
      <stop offset="100%" stop-color="rgba(34, 211, 245, 0)"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="240" rx="8" fill="url(#bgGrad)" stroke="#16324a" stroke-width="1.5"/>
  <rect width="900" height="240" fill="url(#centerGlow)"/>

  <!-- HUD Corner Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 888 36 L 888 12 L 864 12" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 12 204 L 12 228 L 36 228" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 888 204 L 888 228 L 864 228" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Subtle Grid lines -->
  <line x1="40" y1="60" x2="860" y2="60" stroke="#16324a" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="40" y1="180" x2="860" y2="180" stroke="#16324a" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Radar / Reactor Icon -->
  <g transform="translate(60, 80)">
    <circle cx="40" cy="40" r="36" fill="none" stroke="#16324a" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="26" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.8" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="14" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="40" cy="40" r="5" fill="#22d3ee" filter="url(#glow)"/>
    <line x1="40" y1="4" x2="40" y2="76" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
    <line x1="4" y1="40" x2="76" y2="40" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="160" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif" font-size="11" font-weight="700" fill="#22d3ee" letter-spacing="3" text-transform="uppercase">// CYBER DEFENSE LAB • SIMULATION &amp; ANALYSIS</text>
  <text x="160" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1.5">MALWARE SANDBOX PLATFORM</text>
  <text x="160" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Комплексная система симуляции вредоносного поведения, статического анализа и вычисления Risk Score</text>

  <!-- Status badges bottom -->
  <g transform="translate(160, 185)">
    <!-- Node.js -->
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#101b2e" stroke="#1f5c7d" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#22c55e"/>
    <text x="22" y="16" font-family="monospace" font-size="11" fill="#d9f6ff" font-weight="bold">Node.js</text>

    <!-- Express -->
    <rect x="95" y="0" width="80" height="24" rx="4" fill="#101b2e" stroke="#1f5c7d" stroke-width="1"/>
    <circle cx="107" cy="12" r="3.5" fill="#22d3ee"/>
    <text x="117" y="16" font-family="monospace" font-size="11" fill="#d9f6ff" font-weight="bold">Express</text>

    <!-- MSSQL -->
    <rect x="185" y="0" width="75" height="24" rx="4" fill="#101b2e" stroke="#1f5c7d" stroke-width="1"/>
    <circle cx="197" cy="12" r="3.5" fill="#f59e0b"/>
    <text x="207" y="16" font-family="monospace" font-size="11" fill="#d9f6ff" font-weight="bold">MSSQL</text>

    <!-- Socket.IO -->
    <rect x="270" y="0" width="95" height="24" rx="4" fill="#101b2e" stroke="#1f5c7d" stroke-width="1"/>
    <circle cx="282" cy="12" r="3.5" fill="#a855f7"/>
    <text x="292" y="16" font-family="monospace" font-size="11" fill="#d9f6ff" font-weight="bold">Socket.IO</text>

    <!-- Vanilla HUD -->
    <rect x="375" y="0" width="110" height="24" rx="4" fill="#101b2e" stroke="#1f5c7d" stroke-width="1"/>
    <circle cx="387" cy="12" r="3.5" fill="#38bdf8"/>
    <text x="397" y="16" font-family="monospace" font-size="11" fill="#d9f6ff" font-weight="bold">Cyber HUD</text>
  </g>

  <!-- Right status indicator -->
  <g transform="translate(770, 70)">
    <rect x="0" y="0" width="90" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#34d399" filter="url(#glow)"/>
    <text x="26" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#ecfdf5">STATUS: OK</text>
  </g>
</svg>
