<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%" height="330">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="kpiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c172a"/>
      <stop offset="100%" stop-color="#080f1d"/>
    </linearGradient>
    <filter id="dBurg" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="330" rx="8" fill="#030509" stroke="#16324a" stroke-width="1.5"/>

  <!-- Top bar of the mockup -->
  <g transform="translate(0, 0)">
    <rect width="900" height="42" fill="#080f1d" stroke="#16324a" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>
    <text x="80" y="25" font-family="monospace" font-size="12" fill="#22d3ee" font-weight="bold">MALWARE SANDBOX // COMMAND DASHBOARD</text>
    <text x="730" y="25" font-family="monospace" font-size="11" fill="#64748b">PORT: 3000 • MSSQL: OK</text>
  </g>

  <!-- 4 KPI Cards -->
  <g transform="translate(25, 58)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="200" height="74" rx="4" fill="url(#kpiGrad)" stroke="#16324a" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="74" fill="#22d3ee"/>
    <text x="14" y="20" font-family="monospace" font-size="10" fill="#64748b" letter-spacing="1">ВСЕГО СКАНИРОВАНИЙ</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff">1,482</text>
    <text x="14" y="66" font-family="-apple-system, sans-serif" font-size="10" fill="#38bdf8">↑ +14% за неделю</text>

    <!-- KPI 2 -->
    <rect x="215" y="0" width="200" height="74" rx="4" fill="url(#kpiGrad)" stroke="#16324a" stroke-width="1"/>
    <rect x="215" y="0" width="4" height="74" fill="#22c55e"/>
    <text x="229" y="20" font-family="monospace" font-size="10" fill="#64748b" letter-spacing="1">БЕЗОПАСНЫЕ (CLEAN)</text>
    <text x="229" y="52" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#22c55e">1,094</text>
    <text x="229" y="66" font-family="-apple-system, sans-serif" font-size="10" fill="#86efac">73.8% от общего числа</text>

    <!-- KPI 3 -->
    <rect x="430" y="0" width="200" height="74" rx="4" fill="url(#kpiGrad)" stroke="#16324a" stroke-width="1"/>
    <rect x="430" y="0" width="4" height="74" fill="#f59e0b"/>
    <text x="444" y="20" font-family="monospace" font-size="10" fill="#64748b" letter-spacing="1">ПОДОЗРИТЕЛЬНЫЕ</text>
    <text x="444" y="52" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#f59e0b">264</text>
    <text x="444" y="66" font-family="-apple-system, sans-serif" font-size="10" fill="#fde047">LOW / MEDIUM риски</text>

    <!-- KPI 4 -->
    <rect x="645" y="0" width="205" height="74" rx="4" fill="url(#kpiGrad)" stroke="#16324a" stroke-width="1"/>
    <rect x="645" y="0" width="4" height="74" fill="#ef4444"/>
    <text x="659" y="20" font-family="monospace" font-size="10" fill="#64748b" letter-spacing="1">УГРОЗЫ (CRITICAL)</text>
    <text x="659" y="52" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#ef4444">124</text>
    <text x="659" y="66" font-family="-apple-system, sans-serif" font-size="10" fill="#fca5a5">Заблокировано системой</text>
  </g>

  <!-- Lower panels: Chart preview left & Live feed preview right -->
  <g transform="translate(25, 146)">
    <!-- Chart Box -->
    <rect x="0" y="0" width="520" height="165" rx="4" fill="#070c16" stroke="#16324a" stroke-width="1"/>
    <text x="16" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#22d3ee">▸ АКТИВНОСТЬ ДЕТЕКЦИИ ЗА 30 ДНЕЙ</text>
    
    <!-- SVG Chart bars simulation -->
    <g transform="translate(20, 42)">
      <!-- Baseline -->
      <line x1="0" y1="95" x2="480" y2="95" stroke="#16324a" stroke-width="1"/>
      <line x1="0" y1="50" x2="480" y2="50" stroke="#16324a" stroke-width="0.8" stroke-dasharray="3 3"/>
      
      <!-- Bars -->
      <rect x="15" y="45" width="12" height="50" fill="#22c55e" rx="1"/>
      <rect x="35" y="30" width="12" height="65" fill="#22c55e" rx="1"/>
      <rect x="55" y="55" width="12" height="40" fill="#22c55e" rx="1"/>
      <rect x="75" y="20" width="12" height="75" fill="#38bdf8" rx="1"/>
      <rect x="95" y="40" width="12" height="55" fill="#22c55e" rx="1"/>
      <rect x="115" y="15" width="12" height="80" fill="#ef4444" rx="1"/>
      <rect x="135" y="35" width="12" height="60" fill="#22c55e" rx="1"/>
      <rect x="155" y="50" width="12" height="45" fill="#f59e0b" rx="1"/>
      <rect x="175" y="25" width="12" height="70" fill="#22c55e" rx="1"/>
      <rect x="195" y="60" width="12" height="35" fill="#22c55e" rx="1"/>
      <rect x="215" y="10" width="12" height="85" fill="#ef4444" rx="1"/>
      <rect x="235" y="30" width="12" height="65" fill="#22c55e" rx="1"/>
      <rect x="255" y="45" width="12" height="50" fill="#38bdf8" rx="1"/>
      <rect x="275" y="20" width="12" height="75" fill="#22c55e" rx="1"/>
      <rect x="295" y="40" width="12" height="55" fill="#f59e0b" rx="1"/>
      <rect x="315" y="15" width="12" height="80" fill="#ef4444" rx="1"/>
      <rect x="335" y="35" width="12" height="60" fill="#22c55e" rx="1"/>
      <rect x="355" y="50" width="12" height="45" fill="#22c55e" rx="1"/>
      <rect x="375" y="25" width="12" height="70" fill="#38bdf8" rx="1"/>
      <rect x="395" y="10" width="12" height="85" fill="#ef4444" rx="1"/>
      <rect x="415" y="30" width="12" height="65" fill="#22c55e" rx="1"/>
      <rect x="435" y="40" width="12" height="55" fill="#22c55e" rx="1"/>
      <rect x="455" y="20" width="12" height="75" fill="#22c55e" rx="1"/>
    </g>
  </g>

  <!-- Live Feed preview right -->
  <g transform="translate(560, 146)">
    <rect x="0" y="0" width="315" height="165" rx="4" fill="#070c16" stroke="#16324a" stroke-width="1"/>
    <text x="16" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#22d3ee">▸ ПОТОК СОБЫТИЙ (SOCKET.IO)</text>
    
    <g transform="translate(14, 38)">
      <text x="0" y="15" font-family="monospace" font-size="10.5" fill="#ef4444">[CRIT]</text>
      <text x="45" y="15" font-family="monospace" font-size="10.5" fill="#cbd5e1">Ransomware: массовое шифрование</text>

      <text x="0" y="38" font-family="monospace" font-size="10.5" fill="#f59e0b">[WARN]</text>
      <text x="45" y="38" font-family="monospace" font-size="10.5" fill="#cbd5e1">Worm: попытка SYN-flood на 445/tcp</text>

      <text x="0" y="61" font-family="monospace" font-size="10.5" fill="#38bdf8">[INFO]</text>
      <text x="45" y="61" font-family="monospace" font-size="10.5" fill="#cbd5e1">Analyzer: вычислен SHA-256 хэш</text>

      <text x="0" y="84" font-family="monospace" font-size="10.5" fill="#22c55e">[DONE]</text>
      <text x="45" y="84" font-family="monospace" font-size="10.5" fill="#cbd5e1">Вердикт сохранён в dbo.Scans</text>

      <text x="0" y="107" font-family="monospace" font-size="10.5" fill="#a855f7">[SAND]</text>
      <text x="45" y="107" font-family="monospace" font-size="10.5" fill="#cbd5e1">Worker: правило эмулировано успешно</text>
    </g>
  </g>
</svg>
