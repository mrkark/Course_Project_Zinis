<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <filter id="cBloom" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="320" rx="8" fill="#04060a" stroke="#16324a" stroke-width="1.5"/>

  <!-- Card 1: Worm -->
  <g transform="translate(30, 25)">
    <rect width="265" height="270" rx="4" fill="url(#cardBg)" stroke="#16324a" stroke-width="1.2"/>
    <!-- HUD brackets -->
    <path d="M 0 14 L 0 0 L 14 0" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M 265 256 L 265 270 L 251 270" fill="none" stroke="#22d3ee" stroke-width="2"/>

    <!-- Header -->
    <line x1="14" y1="42" x2="251" y2="42" stroke="#16324a" stroke-width="1"/>
    <text x="14" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">▸ ЧЕРВЬ (Worm)</text>
    <rect x="185" y="14" width="66" height="20" rx="3" fill="rgba(255, 150, 64, 0.15)" stroke="#ff9640" stroke-width="1"/>
    <circle cx="195" cy="24" r="3" fill="#ff9640"/>
    <text x="203" y="28" font-family="monospace" font-size="10" font-weight="bold" fill="#ff9640">ВЫСОКИЙ</text>

    <!-- Description -->
    <text x="14" y="65" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">Самораспространяющееся ВПО,</text>
    <text x="14" y="82" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">использующее уязвимости сети.</text>

    <!-- Signs -->
    <text x="14" y="112" font-family="monospace" font-size="9.5" font-weight="bold" fill="#22d3ee" letter-spacing="1">ПРИЗНАКИ АКТИВНОСТИ</text>
    <text x="14" y="132" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Сканирование портов и сервисов</text>
    <text x="14" y="149" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Саморепликация на сетевые хосты</text>
    <text x="14" y="166" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Эксплуатация уязвимостей SMB/RDP</text>

    <!-- Weights Section -->
    <line x1="14" y1="184" x2="251" y2="184" stroke="#16324a" stroke-width="1"/>
    <text x="14" y="202" font-family="monospace" font-size="9" fill="#64748b" letter-spacing="0.5">ВЕСОВЫЕ КОЭФФИЦИЕНТЫ</text>

    <!-- Chips -->
    <g transform="translate(14, 212)">
      <rect x="0" y="0" width="112" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="6" y="15" font-family="monospace" font-size="10" fill="#94a3b8">Сканирование</text>
      <text x="88" y="15" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+20</text>

      <rect x="118" y="0" width="118" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="124" y="15" font-family="monospace" font-size="10" fill="#94a3b8">Репликация</text>
      <text x="202" y="15" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+30</text>

      <rect x="0" y="26" width="112" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="6" y="41" font-family="monospace" font-size="10" fill="#94a3b8">Эксплойты</text>
      <text x="88" y="41" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+15</text>

      <rect x="118" y="26" width="118" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="124" y="41" font-family="monospace" font-size="10" fill="#94a3b8">Брутфорс</text>
      <text x="202" y="41" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+10</text>
    </g>
  </g>

  <!-- Card 2: Ransomware -->
  <g transform="translate(317, 25)">
    <rect width="265" height="270" rx="4" fill="url(#cardBg)" stroke="#16324a" stroke-width="1.2"/>
    <path d="M 0 14 L 0 0 L 14 0" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M 265 256 L 265 270 L 251 270" fill="none" stroke="#22d3ee" stroke-width="2"/>

    <line x1="14" y1="42" x2="251" y2="42" stroke="#16324a" stroke-width="1"/>
    <text x="14" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">▸ ШИФРОВАЛЬЩИК</text>
    <rect x="175" y="14" width="76" height="20" rx="3" fill="rgba(255, 77, 77, 0.15)" stroke="#ff4d4d" stroke-width="1"/>
    <circle cx="185" cy="24" r="3" fill="#ff4d4d"/>
    <text x="193" y="28" font-family="monospace" font-size="10" font-weight="bold" fill="#ff4d4d">КРИТИЧЕСКИЙ</text>

    <text x="14" y="65" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">Шифрует файлы пользователя и</text>
    <text x="14" y="82" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">требует выкуп за дешифровку.</text>

    <text x="14" y="112" font-family="monospace" font-size="9.5" font-weight="bold" fill="#22d3ee" letter-spacing="1">ПРИЗНАКИ АКТИВНОСТИ</text>
    <text x="14" y="132" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Вызов CryptEncrypt / Crypto API</text>
    <text x="14" y="149" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Переименование .locked / .enc</text>
    <text x="14" y="166" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Создание README_DECRYPT.txt</text>

    <line x1="14" y1="184" x2="251" y2="184" stroke="#16324a" stroke-width="1"/>
    <text x="14" y="202" font-family="monospace" font-size="9" fill="#64748b" letter-spacing="0.5">ВЕСОВЫЕ КОЭФФИЦИЕНТЫ</text>

    <g transform="translate(14, 212)">
      <rect x="0" y="0" width="112" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="6" y="15" font-family="monospace" font-size="10" fill="#94a3b8">Файлы (I/O)</text>
      <text x="88" y="15" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+25</text>

      <rect x="118" y="0" width="118" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="124" y="15" font-family="monospace" font-size="10" fill="#94a3b8">Crypto API</text>
      <text x="202" y="15" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+20</text>

      <rect x="0" y="26" width="112" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="6" y="41" font-family="monospace" font-size="10" fill="#94a3b8">Ransom Note</text>
      <text x="88" y="41" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+30</text>

      <rect x="118" y="26" width="118" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="124" y="41" font-family="monospace" font-size="10" fill="#94a3b8">C2 Канал</text>
      <text x="202" y="41" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+15</text>
    </g>
  </g>

  <!-- Card 3: Keylogger -->
  <g transform="translate(605, 25)">
    <rect width="265" height="270" rx="4" fill="url(#cardBg)" stroke="#16324a" stroke-width="1.2"/>
    <path d="M 0 14 L 0 0 L 14 0" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M 265 256 L 265 270 L 251 270" fill="none" stroke="#22d3ee" stroke-width="2"/>

    <line x1="14" y1="42" x2="251" y2="42" stroke="#16324a" stroke-width="1"/>
    <text x="14" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">▸ КЕЙЛОГГЕР</text>
    <rect x="185" y="14" width="66" height="20" rx="3" fill="rgba(255, 150, 64, 0.15)" stroke="#ff9640" stroke-width="1"/>
    <circle cx="195" cy="24" r="3" fill="#ff9640"/>
    <text x="203" y="28" font-family="monospace" font-size="10" font-weight="bold" fill="#ff9640">ВЫСОКИЙ</text>

    <text x="14" y="65" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">Скрытый перехват нажатий клавиш,</text>
    <text x="14" y="82" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">буфера обмена и отправка в C&amp;C.</text>

    <text x="14" y="112" font-family="monospace" font-size="9.5" font-weight="bold" fill="#22d3ee" letter-spacing="1">ПРИЗНАКИ АКТИВНОСТИ</text>
    <text x="14" y="132" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Хук SetWindowsHookEx (WH_KEYBOARD)</text>
    <text x="14" y="149" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Мониторинг буфера обмена</text>
    <text x="14" y="166" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Скрытие из диспетчера задач</text>

    <line x1="14" y1="184" x2="251" y2="184" stroke="#16324a" stroke-width="1"/>
    <text x="14" y="202" font-family="monospace" font-size="9" fill="#64748b" letter-spacing="0.5">ВЕСОВЫЕ КОЭФФИЦИЕНТЫ</text>

    <g transform="translate(14, 212)">
      <rect x="0" y="0" width="112" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="6" y="15" font-family="monospace" font-size="10" fill="#94a3b8">Клавиши</text>
      <text x="88" y="15" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+30</text>

      <rect x="118" y="0" width="118" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="124" y="15" font-family="monospace" font-size="10" fill="#94a3b8">Буфер обмена</text>
      <text x="202" y="15" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+15</text>

      <rect x="0" y="26" width="112" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="6" y="41" font-family="monospace" font-size="10" fill="#94a3b8">Эксфильтрация</text>
      <text x="88" y="41" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+25</text>

      <rect x="118" y="26" width="118" height="22" rx="3" fill="#030509" stroke="#16324a" stroke-width="1"/>
      <text x="124" y="41" font-family="monospace" font-size="10" fill="#94a3b8">Автозагрузка</text>
      <text x="202" y="41" font-family="monospace" font-size="10" font-weight="bold" fill="#22d3ee">+15</text>
    </g>
  </g>
</svg>
